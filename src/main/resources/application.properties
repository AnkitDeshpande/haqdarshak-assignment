# Spring Boot Application Configuration - Haqdarshak Scheme Knowledge Base

spring.application.name=haqdarshak-publishing-backend

# Default Database Configuration: MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/haqdarshak_kb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT Security Configuration
app.jwt.secret=${APP_JWT_SECRET:haqdarshak_secure_jwt_secret_key_at_least_256_bits_long_for_hmac_sha256_review_and_publish}
app.jwt.expiration-ms=86400000

# Server Port
server.port=8080

# Logging
logging.level.org.haqdarshak=INFO
logging.level.org.springframework.security=INFO
